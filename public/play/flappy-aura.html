<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Aura</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-y: auto;
            flex-direction: column;
            gap: 20px;
            padding: 16px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .menu {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 24px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: min(500px, 100%);
            z-index: 1000;
        }

        .menu h2 {
            margin-bottom: 4px;
            color: #333;
        }

        .author {
            margin-bottom: 16px;
            font-size: 13px;
            font-weight: bold;
            color: #667eea;
            letter-spacing: 0.3px;
        }

        .menu-section {
            margin-bottom: 12px;
        }

        .menu-section label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        .option-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
            gap: 8px;
        }

        .option-btn {
            padding: 7px 6px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 11px;
            font-weight: bold;
        }

        .option-btn:hover {
            transform: scale(1.05);
        }

        .option-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .start-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 12px;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        .menu.hidden {
            display: none;
        }

        .container {
            position: relative;
            /* Keep the 2:3 play area, but never exceed the viewport in
               either dimension — works in portrait and landscape. */
            aspect-ratio: 2 / 3;
            width: min(400px, 100%, calc((100dvh - 32px) * 2 / 3));
            height: auto;
            background: linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%);
            border: 3px solid #333;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .score {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            z-index: 10;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
        }

        .theme-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 12px;
            color: #333;
            background: rgba(255, 255, 255, 0.7);
            padding: 5px 10px;
            border-radius: 5px;
            z-index: 10;
        }

        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: clamp(24px, 8%, 40px);
            border-radius: 10px;
            text-align: center;
            z-index: 100;
            display: none;
            width: 80%;
            max-width: 260px;
        }

        .game-over.show {
            display: block;
        }

        .game-over h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        .game-over p {
            font-size: 18px;
            margin: 10px 0;
        }

        .game-over button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .game-over button:hover {
            background: #764ba2;
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #333;
            font-size: 12px;
            background: rgba(255, 255, 255, 0.7);
            padding: 10px 15px;
            border-radius: 5px;
            z-index: 10;
        }

        .controls {
            position: absolute;
            top: 65px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 10;
        }

        .menu-toggle, #soundToggle {
            background: rgba(255, 255, 255, 0.7);
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.3s;
        }

        .menu-toggle:hover, #soundToggle:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        #soundToggle.sound-off {
            background: rgba(255, 100, 100, 0.7);
            color: white;
        }

        .skin-preview {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }

        .container.hidden {
            display: none;
        }

        @media (max-width: 420px) {
            .score {
                font-size: 18px;
                padding: 7px 11px;
            }
            .theme-indicator {
                font-size: 11px;
            }
            .menu-toggle, #soundToggle {
                padding: 6px 9px;
                font-size: 11px;
            }
            .instructions {
                font-size: 11px;
                bottom: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="menu" id="menu">
        <h2>🎮 Flappy Aura</h2>
        <p class="author">by ankitathatte.com</p>

        <div class="menu-section">
            <label>Select Bird Skin:</label>
            <div class="option-grid" id="skinOptions"></div>
        </div>

        <div class="menu-section">
            <label>Select Theme:</label>
            <div class="option-grid" id="themeOptions"></div>
        </div>

        <button class="start-btn" onclick="startGame()">Start Game</button>
    </div>

    <div class="container hidden" id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
        <div class="score" id="score">Score: 0</div>
        <div class="theme-indicator" id="themeIndicator"></div>
        <div class="controls">
            <button id="soundToggle" onclick="toggleSound()">🔊 Sound ON</button>
            <button class="menu-toggle" onclick="toggleMenu()">Menu</button>
        </div>
        <div class="game-over" id="gameOver">
            <h1>Game Over!</h1>
            <p id="finalScore">Final Score: 0</p>
            <button onclick="toggleMenu()">Back to Menu</button>
        </div>
        <div class="instructions">Click or Press SPACE to fly</div>
    </div>

    <script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const scoreDisplay = document.getElementById('score');
const gameOverScreen = document.getElementById('gameOver');
const finalScoreDisplay = document.getElementById('finalScore');
const menu = document.getElementById('menu');
const gameContainer = document.getElementById('gameContainer');
const themeIndicator = document.getElementById('themeIndicator');

// Game variables
let gameRunning = false;
let score = 0;
// Safe localStorage helpers (sandboxed frames can throw on access)
function loadHighScore() {
    try {
        return Number(localStorage.getItem('flappyAuraHighScore')) || 0;
    } catch (e) {
        return 0;
    }
}
function saveHighScore(value) {
    try {
        localStorage.setItem('flappyAuraHighScore', String(value));
    } catch (e) {
        /* storage unavailable — keep high score in memory for this session */
    }
}
let highScore = loadHighScore();
let currentSkin = 'classic';
let currentTheme = 'sky';
let soundEnabled = true;

// Audio Context
const audioContext = new (window.AudioContext || window.webkitAudioContext)();

// Particle System
let particles = [];

class Particle {
    constructor(x, y, type = 'jump') {
        this.x = x;
        this.y = y;
        this.type = type;
        this.life = 1;
        this.maxLife = 1;
        
        if (type === 'jump') {
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4 - 2;
            this.size = Math.random() * 4 + 2;
            this.colors = ['#FFD700', '#FFA500', '#FF6B35'];
            this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        } else if (type === 'score') {
            this.vx = (Math.random() - 0.5) * 3;
            this.vy = -2;
            this.size = Math.random() * 3 + 2;
            this.colors = ['#FFD700', '#FFD93D', '#00D9FF'];
            this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
        } else if (type === 'collision') {
            this.vx = (Math.random() - 0.5) * 6;
            this.vy = (Math.random() - 0.5) * 6 - 1;
            this.size = Math.random() * 6 + 3;
            this.colors = ['#FF0000', '#FF6B35', '#FFD700'];
            this.color = this.colors[Math.floor(Math.random() * this.colors.length)];
            this.maxLife = 0.8;
        }
    }
    
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15; // gravity
        this.life -= 0.02;
    }
    
    draw() {
        ctx.save();
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
    
    isAlive() {
        return this.life > 0;
    }
}

// Create particles
function createParticles(x, y, type = 'jump', count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push(new Particle(x, y, type));
    }
}

// Update and draw particles
function updateParticles() {
    particles = particles.filter(p => p.isAlive());
    particles.forEach(p => {
        p.update();
        p.draw();
    });
}

// Sound Effects Generator
const sounds = {
    jump: () => {
        if (!soundEnabled) return;
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
        
        osc.start(now);
        osc.stop(now + 0.1);
    },
    
    score: () => {
        if (!soundEnabled) return;
        const now = audioContext.currentTime;
        
        // Create two tones for score sound
        for (let i = 0; i < 2; i++) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            const freq = i === 0 ? 523 : 659; // C5, E5
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            
            osc.start(now);
            osc.stop(now + 0.15);
        }
    },
    
    collision: () => {
        if (!soundEnabled) return;
        const now = audioContext.currentTime;
        const osc = audioContext.createOscillator();
        const gain = audioContext.createGain();
        
        osc.connect(gain);
        gain.connect(audioContext.destination);
        
        osc.frequency.setValueAtTime(200, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.3);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
        
        osc.start(now);
        osc.stop(now + 0.3);
    },
    
    gameOver: () => {
        if (!soundEnabled) return;
        const now = audioContext.currentTime;
        
        // Descending tones
        const freqs = [330, 294, 262]; // E4, D4, C4
        freqs.forEach((freq, i) => {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            const startTime = now + (i * 0.15);
            osc.frequency.setValueAtTime(freq, startTime);
            gain.gain.setValueAtTime(0.2, startTime);
            gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);
            
            osc.start(startTime);
            osc.stop(startTime + 0.15);
        });
    }
};

// Bird Skins
const birdSkins = {
    classic: {
        name: 'Classic',
        color: '#FFD700',
        draw: function(x, y) {
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(x + 15, y + 15, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 20, y + 12, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    },
    fire: {
        name: '🔥 Fire',
        color: '#FF6B35',
        draw: function(x, y) {
            // Main body
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(x + 15, y + 15, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Fire effect
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.arc(x + 15, y + 8, 8, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x + 15, y + 10, 5, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(x + 20, y + 12, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    },
    ice: {
        name: '❄️ Ice',
        color: '#00D9FF',
        draw: function(x, y) {
            // Main body
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(x + 15, y + 15, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Ice shine
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x + 20, y + 8, 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#003366';
            ctx.beginPath();
            ctx.arc(x + 20, y + 12, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    },
    cosmic: {
        name: '🌌 Cosmic',
        color: '#9D4EDD',
        draw: function(x, y) {
            // Main body
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(x + 15, y + 15, 15, 0, Math.PI * 2);
            ctx.fill();
            
            // Stars
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x + 10, y + 10, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 20, y + 18, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 25, y + 10, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Eye
            ctx.fillStyle = '#00D9FF';
            ctx.beginPath();
            ctx.arc(x + 20, y + 12, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    },
    ghost: {
        name: '👻 Ghost',
        color: '#ffffff',
        draw: function(x, y) {
            // Body
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(x + 5, y + 10);
            ctx.quadraticCurveTo(x + 5, y + 5, x + 15, y + 5);
            ctx.quadraticCurveTo(x + 25, y + 5, x + 25, y + 10);
            ctx.lineTo(x + 25, y + 25);
            ctx.quadraticCurveTo(x + 20, y + 30, x + 15, y + 28);
            ctx.quadraticCurveTo(x + 10, y + 30, x + 5, y + 25);
            ctx.fill();
            
            // Eyes
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x + 11, y + 12, 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 19, y + 12, 2, 0, Math.PI * 2);
            ctx.fill();
            
            // Mouth
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x + 15, y + 18, 2, 0, Math.PI);
            ctx.stroke();
        }
    },
    robot: {
        name: '🤖 Robot',
        color: '#888888',
        draw: function(x, y) {
            // Head
            ctx.fillStyle = this.color;
            ctx.fillRect(x + 5, y + 5, 20, 20);
            
            // Eyes
            ctx.fillStyle = '#FF0000';
            ctx.fillRect(x + 8, y + 10, 4, 4);
            ctx.fillRect(x + 18, y + 10, 4, 4);
            
            // Body
            ctx.fillStyle = this.color;
            ctx.fillRect(x + 7, y + 25, 16, 10);
            
            // Antenna
            ctx.strokeStyle = this.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 15, y + 5);
            ctx.lineTo(x + 15, y - 5);
            ctx.stroke();
        }
    }
};

// Game Themes
const themes = {
    sky: {
        name: 'Sky',
        background: 'linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%)',
        pipeColor: '#22c55e',
        containerBg: 'linear-gradient(180deg, #87ceeb 0%, #e0f6ff 100%)',
        containerBorder: '#333'
    },
    night: {
        name: 'Night',
        background: 'linear-gradient(180deg, #1a1a2e 0%, #16213e 100%)',
        pipeColor: '#0f3460',
        containerBg: 'linear-gradient(180deg, #1a1a2e 0%, #16213e 100%)',
        containerBorder: '#e94560'
    },
    sunset: {
        name: 'Sunset',
        background: 'linear-gradient(180deg, #FF6B6B 0%, #FFA500 50%, #FFD93D 100%)',
        pipeColor: '#C92A2A',
        containerBg: 'linear-gradient(180deg, #FF6B6B 0%, #FFA500 50%, #FFD93D 100%)',
        containerBorder: '#8B0000'
    },
    forest: {
        name: 'Forest',
        background: 'linear-gradient(180deg, #134E5E 0%, #71B280 100%)',
        pipeColor: '#22c55e',
        containerBg: 'linear-gradient(180deg, #134E5E 0%, #71B280 100%)',
        containerBorder: '#0a3622'
    },
    neon: {
        name: 'Neon',
        background: 'linear-gradient(180deg, #0a0e27 0%, #1a1a3e 100%)',
        pipeColor: '#00ff88',
        containerBg: 'linear-gradient(180deg, #0a0e27 0%, #1a1a3e 100%)',
        containerBorder: '#00ffff'
    },
    candy: {
        name: 'Candy',
        background: 'linear-gradient(180deg, #FFB6C1 0%, #FFD700 50%, #87CEEB 100%)',
        pipeColor: '#FF1493',
        containerBg: 'linear-gradient(180deg, #FFB6C1 0%, #FFD700 50%, #87CEEB 100%)',
        containerBorder: '#FF69B4'
    }
};

// Bird object
const bird = {
    x: 50,
    y: 150,
    width: 30,
    height: 30,
    velocity: 0,
    gravity: 0.15,
    jumpPower: -5
};

// Pipe object
const pipeWidth = 60;
const pipeGap = 220;
const pipeSpacing = 280;
const pipeSpeed = 2;
let pipes = [];

// Initialize pipes
function initPipes() {
    pipes = [];
    for (let i = 0; i < 3; i++) {
        pipes.push({
            x: canvas.width + i * pipeSpacing,
            topHeight: Math.random() * (canvas.height - pipeGap - 100) + 50
        });
    }
}

// Apply theme to UI
function applyTheme(themeName) {
    const theme = themes[themeName];
    const container = document.querySelector('.container');
    container.style.background = theme.containerBg;
    container.style.borderColor = theme.containerBorder;
    themeIndicator.textContent = `🎨 ${theme.name}`;
}

// Update the live score/best readout in the corner
function updateScoreDisplay() {
    scoreDisplay.textContent = `Score: ${score} · Best: ${highScore}`;
}

// Draw the big live score on the canvas, updating every frame
function drawLiveScore() {
    ctx.save();
    ctx.font = 'bold 64px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.55)';
    ctx.fillStyle = '#ffffff';
    ctx.strokeText(score, canvas.width / 2, 80);
    ctx.fillText(score, canvas.width / 2, 80);
    ctx.restore();
}

// Draw bird using current skin
function drawBird() {
    const skin = birdSkins[currentSkin];
    skin.draw(bird.x - 15, bird.y - 15);
}

// Draw pipes
function drawPipes() {
    const theme = themes[currentTheme];
    ctx.fillStyle = theme.pipeColor;
    pipes.forEach(pipe => {
        // Top pipe
        ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
        
        // Bottom pipe
        const bottomPipeY = pipe.topHeight + pipeGap;
        ctx.fillRect(pipe.x, bottomPipeY, pipeWidth, canvas.height - bottomPipeY);
    });
}

// Update bird physics
function updateBird() {
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;
    
    // Collision with ground or ceiling
    if (bird.y + bird.height >= canvas.height || bird.y <= 0) {
        endGame();
    }
}

// Update pipes
function updatePipes() {
    pipes.forEach(pipe => {
        pipe.x -= pipeSpeed;
    });
    
    // Remove off-screen pipes and add new ones
    if (pipes[0].x + pipeWidth < 0) {
        pipes.shift();
        pipes.push({
            x: pipes[pipes.length - 1].x + pipeSpacing,
            topHeight: Math.random() * (canvas.height - pipeGap - 100) + 50
        });
    }
}

// Collision detection
function checkCollision() {
    pipes.forEach(pipe => {
        // Check if bird is within pipe's x range
        if (bird.x + bird.width > pipe.x && bird.x < pipe.x + pipeWidth) {
            // Check collision with top or bottom pipe
            if (bird.y < pipe.topHeight || bird.y + bird.height > pipe.topHeight + pipeGap) {
                endGame();
            }
        }
        
        // Score when passing a pipe
        if (pipe.x + pipeWidth === bird.x && !pipe.scored) {
            pipe.scored = true;
            score++;
            updateScoreDisplay();
            createParticles(bird.x, bird.y, 'score', 12);
            sounds.score();
        }
    });
}

// Game over
function endGame() {
    gameRunning = false;

    let newBest = false;
    if (score > highScore) {
        highScore = score;
        saveHighScore(highScore);
        newBest = true;
    }
    updateScoreDisplay();

    createParticles(bird.x, bird.y, 'collision', 20);
    sounds.collision();
    gameOverScreen.classList.add('show');
    finalScoreDisplay.innerHTML = newBest
        ? `Final Score: ${score}<br>🏆 New Best!`
        : `Final Score: ${score}<br>Best: ${highScore}`;
    setTimeout(() => sounds.gameOver(), 100);
}

// Game loop
function gameLoop() {
    // Draw background
    const theme = themes[currentTheme];
    const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
    
    // Parse gradient colors
    if (theme.background.includes('linear-gradient')) {
        const colors = theme.background.match(/#[0-9a-f]{6}|rgb[^)]*\)[^,]*/gi);
        if (colors && colors.length >= 2) {
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(1, colors[colors.length - 1]);
        }
    }
    
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    if (gameRunning) {
        updateBird();
        updatePipes();
        checkCollision();
    }
    
    drawPipes();
    drawBird();
    if (gameRunning) {
        drawLiveScore();
    }
    updateParticles();

    requestAnimationFrame(gameLoop);
}

// Toggle sound
function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundToggle');
    btn.textContent = soundEnabled ? '🔊 Sound ON' : '🔇 Sound OFF';
    btn.classList.toggle('sound-off', !soundEnabled);
}

// Menu functions
function createMenuOptions() {
    const skinContainer = document.getElementById('skinOptions');
    const themeContainer = document.getElementById('themeOptions');
    
    // Create skin options
    Object.keys(birdSkins).forEach(skinKey => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (skinKey === 'classic') btn.classList.add('active');
        btn.innerHTML = `<span class="skin-preview" style="background: ${birdSkins[skinKey].color}"></span>${birdSkins[skinKey].name}`;
        btn.onclick = () => {
            document.querySelectorAll('#skinOptions .option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentSkin = skinKey;
        };
        skinContainer.appendChild(btn);
    });
    
    // Create theme options
    Object.keys(themes).forEach(themeKey => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        if (themeKey === 'sky') btn.classList.add('active');
        btn.textContent = themes[themeKey].name;
        btn.onclick = () => {
            document.querySelectorAll('#themeOptions .option-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentTheme = themeKey;
            applyTheme(themeKey);
        };
        themeContainer.appendChild(btn);
    });
}

function toggleMenu() {
    menu.classList.toggle('hidden');
    gameContainer.classList.toggle('hidden');
    if (gameRunning) {
        gameRunning = false;
    }
}

function startGame() {
    menu.classList.add('hidden');
    gameContainer.classList.remove('hidden');
    
    // Reset game
    score = 0;
    updateScoreDisplay();
    gameOverScreen.classList.remove('show');
    bird.y = 150;
    bird.velocity = 0;
    gameRunning = true;
    particles = [];
    
    initPipes();
    applyTheme(currentTheme);
}

// Input handling
document.addEventListener('click', (e) => {
    if (gameRunning && !e.target.closest('button')) {
        bird.velocity = bird.jumpPower;
        createParticles(bird.x, bird.y, 'jump', 6);
        sounds.jump();
    }
});

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && gameRunning) {
        bird.velocity = bird.jumpPower;
        createParticles(bird.x, bird.y, 'jump', 6);
        sounds.jump();
        e.preventDefault();
    }
});

// Touch support for mobile
document.addEventListener('touchstart', (e) => {
    if (gameRunning && !e.target.closest('button')) {
        bird.velocity = bird.jumpPower;
        createParticles(bird.x, bird.y, 'jump', 6);
        sounds.jump();
    }
});

// Initialize
createMenuOptions();
applyTheme('sky');
gameLoop();
</script>
</body>
</html>
